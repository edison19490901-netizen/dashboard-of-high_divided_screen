name: Daily PushPlus Report

on:
  schedule:
    # 北京时间 15:30 = UTC 07:30, 周一至周五
    - cron: '30 7 * * 1-5'
  workflow_dispatch:  # 手动触发

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install tushare baostock pandas pyarrow python-dotenv

      - name: Run pipeline (PushPlus only, no git push)
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python gh_update.py
